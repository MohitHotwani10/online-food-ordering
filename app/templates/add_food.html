<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Food | FoodExpress</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


<div class="container my-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="fw-bold mb-4">
                        Add Food Item
                    </h2>


                    <form method="POST">


                        <div class="mb-3">

                            <label class="form-label">
                                Food Name
                            </label>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Description
                            </label>

                            <textarea
                                name="description"
                                class="form-control"
                                required
                            ></textarea>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Price
                            </label>

                            <input
                                type="number"
                                name="price"
                                step="0.01"
                                min="0"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Category
                            </label>

                            <input
                                type="text"
                                name="category"
                                class="form-control"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-warning w-100"
                        >
                            Add Food
                        </button>


                        <a
                            href="{{ url_for('admin') }}"
                            class="btn btn-outline-dark w-100 mt-2"
                        >
                            Cancel
                        </a>


                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


</body>

</html>
